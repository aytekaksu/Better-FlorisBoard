name: Better FlorisBoard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install Android native toolchain
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"
          "cmake;4.1.2"
          "ndk;29.0.14206865"

      - name: Test contribution governance policy
        run: bash .github/scripts/require-maintainer-approval-test.sh

      - name: Check formatting, Kotlin, Android, and privacy rules
        run: ./gradlew ciStaticAnalysis --stacktrace

      - name: Upload static-analysis reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-analysis-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/reports/detekt/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
            **/build/reports/lint-results-*.sarif

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install Android native toolchain
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"
          "cmake;4.1.2"
          "ndk;29.0.14206865"

      - name: Run JVM and Robolectric tests
        run: ./gradlew ciUnitTest --stacktrace

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
            **/build/reports/kover/**

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install Android native toolchain
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"
          "cmake;4.1.2"
          "ndk;29.0.14206865"

      - name: Build debug, minified beta, benchmark, and API artifacts
        run: ./gradlew ciPackage --stacktrace

      - name: Verify packaged privacy invariants
        shell: bash
        run: |
          readonly apk="app/build/outputs/apk/beta/app-beta-unsigned.apk"
          readonly aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -f "$apk"
          test -x "$aapt"

          permissions="$("$aapt" dump permissions "$apk")"
          if grep -Fq "android.permission.INTERNET" <<< "$permissions"; then
            echo "::error::The production-like APK must not request INTERNET permission."
            exit 1
          fi

          manifest="$("$aapt" dump xmltree "$apk" AndroidManifest.xml)"
          if grep -Eq "android:debuggable.*(0xffffffff|0x1)$" <<< "$manifest"; then
            echo "::error::The production-like APK must not be debuggable."
            exit 1
          fi
          if grep -Fq "EditorHarnessActivity" <<< "$manifest" ||
            grep -Fq "dev.patrickgold.florisboard.test.action.EDITOR_HARNESS" <<< "$manifest"; then
            echo "::error::The production-like APK must not contain the debug-only editor harness."
            exit 1
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-builds
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/beta/app-beta-unsigned.apk
            benchmark/build/outputs/apk/**/*.apk
            lib/autocorrect-api/build/outputs/aar/autocorrect-api-release.aar

      - name: Upload packaging reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaging-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/mapping/beta/**
            app/build/outputs/logs/**
            lib/autocorrect-api/build/outputs/logs/**

  # Keep this job id unchanged: branch protection currently requires "build".
  # It succeeds only when every independent quality lane succeeds.
  build:
    needs: [static-analysis, unit-tests, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every quality job
        env:
          STATIC_RESULT: ${{ needs.static-analysis.result }}
          TEST_RESULT: ${{ needs.unit-tests.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$STATIC_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
