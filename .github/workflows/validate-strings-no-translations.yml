name: Validate no translated strings.xml included

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Keep this job id unchanged: branch protection currently requires "validate".
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate changed resource files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          changed_files="$(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[].filename'
          )"

          illegal_files="$(
            grep -E '^app/src/main/res/values-.+/strings\.xml$' <<< "$changed_files" || true
          )"
          if [[ -n "$illegal_files" ]]; then
            echo "::error::Translated strings.xml files are managed outside pull requests."
            sed 's/^/  - /' <<< "$illegal_files"
            exit 1
          fi

          echo "No translated strings.xml files were changed."
