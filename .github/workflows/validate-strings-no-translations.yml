name: Validate no translated strings.xml included

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Governance checks the "validate" run for outside contributions.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate changed resource files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          git fetch --no-tags --depth=1 origin "refs/pull/$PR_NUMBER/head"
          if [[ "$(git rev-parse FETCH_HEAD)" != "$HEAD_SHA" ]]; then
            echo "::error::Pull request head moved during validation; rerun on its current head."
            exit 1
          fi

          # NUL-delimited paths avoid Git's quoting for unusual file names.
          git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA" -- | python3 -c '
          import re
          import sys

          paths = sys.stdin.buffer.read().split(b"\0")
          if any(re.fullmatch(rb"app/src/main/res/values-[^/]+/strings\.xml", path) for path in paths):
              print("::error::Localized strings.xml files are not allowed.", file=sys.stderr)
              sys.exit(1)
          print("No localized strings.xml files were changed.")
          '
