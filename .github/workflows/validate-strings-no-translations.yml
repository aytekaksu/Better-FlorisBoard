name: Validate no translated strings.xml included

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Governance checks the "validate" run for outside contributions.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate changed resource files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          git fetch --no-tags --depth=1 origin "refs/pull/$PR_NUMBER/head"
          if [[ "$(git rev-parse FETCH_HEAD)" != "$HEAD_SHA" ]]; then
            echo "::error::Pull request head moved during validation; rerun on its current head."
            exit 1
          fi

          python3 -m unittest discover -s .github/scripts -p 'test_validate_localized_strings.py' -q
          python3 .github/scripts/validate_localized_strings.py "$BASE_SHA" "$HEAD_SHA"
