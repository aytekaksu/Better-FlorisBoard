name: Contribution governance

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    branches: [main]
    types: [submitted, dismissed]
  workflow_run:
    workflows:
      - Better FlorisBoard CI
      - Validate no translated strings.xml included
    types: [completed]

permissions:
  checks: read
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: governance-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance evaluator
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      # pull_request_target must never check out or execute the untrusted PR head.
      - name: Checkout trusted base policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Apply conditional merge policy
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTAINER_LOGIN: aytekaksu
        shell: bash
        run: |
          set -euo pipefail

          resolve_pr_number() {
            if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
              local number
              number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
              if [[ -n "$number" ]]; then
                printf '%s\n' "$number"
                return
              fi

              local head_sha
              head_sha="$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")"
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/$GITHUB_REPOSITORY/commits/$head_sha/pulls" \
                --jq '[.[] | select(.state == "open" and .base.ref == "main")][0].number // empty'
            else
              jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH"
            fi
          }

          readonly pr_number="$(resolve_pr_number)"
          if [[ -z "$pr_number" ]]; then
            echo "No pull request is associated with this workflow run."
            exit 0
          fi

          readonly pr="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/pulls/$pr_number"
          )"
          readonly pr_state="$(jq -r '.state' <<< "$pr")"
          readonly pr_draft="$(jq -r '.draft' <<< "$pr")"
          if [[ "$pr_state" != "open" || "$pr_draft" == "true" ]]; then
            echo "Pull request #$pr_number is closed or still a draft."
            exit 0
          fi

          readonly pr_author="$(jq -r '.user.login' <<< "$pr")"
          readonly pr_head_sha="$(jq -r '.head.sha' <<< "$pr")"
          readonly status_endpoint="repos/$GITHUB_REPOSITORY/statuses/$pr_head_sha"
          readonly run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          update_status() {
            gh api "$status_endpoint" \
              --method POST \
              -f context="governance-policy" \
              -f state="$1" \
              -f description="$2" \
              -f target_url="$run_url" \
              >/dev/null
          }

          update_status "pending" "Evaluating conditional merge policy"

          if [[ "$pr_author" == "$MAINTAINER_LOGIN" ]]; then
            update_status "success" "Maintainer PR; CI is advisory"
            gh pr merge "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --rebase \
              --auto
            echo "Auto-merge enabled for maintainer pull request #$pr_number."
            exit 0
          fi

          if gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/pulls/$pr_number/reviews?per_page=100" |
            MAINTAINER_LOGIN="$MAINTAINER_LOGIN" \
              PR_AUTHOR="$pr_author" \
              PR_HEAD_SHA="$pr_head_sha" \
              bash .github/scripts/require-maintainer-approval.sh; then
            :
          else
            update_status "failure" "Current maintainer approval is required"
            exit 1
          fi

          set +e
          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/commits/$pr_head_sha/check-runs?per_page=100" |
            bash .github/scripts/require-external-ci.sh
          readonly ci_result=$?
          set -e

          case "$ci_result" in
            0)
              update_status "success" "Maintainer approval and required CI passed"
              ;;
            2)
              update_status "pending" "Waiting for outside-contribution CI"
              ;;
            *)
              update_status "failure" "Outside-contribution CI failed"
              exit 1
              ;;
          esac
